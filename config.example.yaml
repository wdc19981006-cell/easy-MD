# Example only: copy to ignored config.local.yaml and configure actual paths.
# easy-md v4.0
# Machine-specific paths stay configurable here. Compatibility scripts that
# write files require a dedicated --work-dir (or EASYMD_WORK_DIR).

paths:
  python: "C:/path/to/workflow/python.exe"
  vina: "C:/path/to/vina.exe"
  obabel: "C:/path/to/obabel.exe"
  pymol: "C:/path/to/PyMOL/Scripts/pymol.exe"
  pymol_python: "C:/path/to/PyMOL/python.exe"
  output_root: "D:/Desktop/codex-result/easy_MD"
  work_root: null
  desktop: "D:/Desktop"

docking:
  exhaustiveness: 32
  num_modes: 9
  energy_range: 3
  num_runs: 3
  seeds:
    - 42
    - 2024
    - 8888
  cpu_leave_free: 1
  expected_runtime: "typically 5-30 minutes on this workstation; CPU and box dependent"

acquisition:
  pdb_candidates: 15
  request_timeout: 30

box:
  padding: 8.0
  min_size: 22.0
  max_size: 30.0
  blind_padding: 10.0

ligand:
  num_conformers: 10
  prune_rms_thresh: 0.5
  random_seed: 42
  ph: 7.4

protein:
  ph: 7.4
  metal_proximity_cutoff: 10.0

